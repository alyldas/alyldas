name: Update README stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&theme=transparent&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=transparent&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        run: |
          mkdir -p profile
          url="https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=transparent&hide_border=true"

          if curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 150 \
            --connect-timeout 10 \
            --max-time 20 \
            "$url" \
            --output profile/streak.svg.next; then
            mv profile/streak.svg.next profile/streak.svg
          else
            echo "::warning::Streak stats service is unavailable; keeping the previous card"
          fi

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update README stats"
          git push
